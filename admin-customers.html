<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>客户管理 - 重庆恒慈国际贸易有限公司</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="sidebar">
    <div class="logo">🚢 恒慈国际贸易管理</div>
    <nav>
      <a href="admin-dashboard.html">📊 仪表盘</a>
      <a href="admin.html">📰 新闻管理</a>
      <a href="admin-orders.html">📦 订单管理</a>
      <a href="admin-customers.html" class="active">👥 客户管理</a>
      <a href="admin-quotes.html">💰 报价管理</a>
      <a href="admin-inquiry.html">📋 询价管理</a>
      <a href="admin-chat.html">💬 客服管理</a>
      <a href="admin-reports.html">📈 数据分析</a>
      <a href="admin-logs.html">🔒 登录日志</a>
    </nav>
  </div>

  <div class="main-content">
    <div class="header">
      <h1>👥 客户管理</h1>
      <div class="user-info">
        <span class="user-name" id="userName">管理员</span>
        <button class="btn btn-secondary btn-sm" onclick="logout()">退出登录</button>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-icon blue">👥</div>
        <div class="stat-content">
          <div class="stat-value" id="statTotal">--</div>
          <div class="stat-label">客户总数</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green">✅</div>
        <div class="stat-content">
          <div class="stat-value" id="statActive">--</div>
          <div class="stat-label">活跃客户</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange">💰</div>
        <div class="stat-content">
          <div class="stat-value">¥<span id="statTotalValue">--</span></div>
          <div class="stat-label">累计交易额</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon purple">📞</div>
        <div class="stat-content">
          <div class="stat-value" id="statAvgContact">--</div>
          <div class="stat-label">平均联系次数</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">客户列表</div>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-secondary" onclick="exportCustomers()">📥 导出CSV</button>
          <button class="btn btn-primary" onclick="showAddModal()">+ 添加客户</button>
          <button class="btn btn-secondary" onclick="showGroupModal()">📁 分组管理</button>
        </div>
      </div>
      
      <div class="search-bar">
        <input type="text" id="searchKeyword" placeholder="搜索客户名称、公司、电话..." onkeyup="handleSearch()">
        <select id="typeFilter" onchange="handleFilter()">
          <option value="">全部类型</option>
          <option value="general">普通客户</option>
          <option value="enterprise">企业客户</option>
          <option value="agent">代理客户</option>
          <option value="VIP">VIP客户</option>
        </select>
        <select id="groupFilter" onchange="handleFilter()">
          <option value="">全部分组</option>
          <option value="group_a">A组</option>
          <option value="group_b">B组</option>
          <option value="group_c">C组</option>
        </select>
        <div style="display: flex; gap: 4px; flex-wrap: wrap;">
          <span style="font-size: 13px; color: var(--text-secondary); margin-right: 8px;">标签筛选:</span>
          <button class="btn btn-secondary btn-sm tag-filter" data-tag="new" onclick="filterByTag('new')">new</button>
          <button class="btn btn-secondary btn-sm tag-filter" data-tag="potential" onclick="filterByTag('potential')">potential</button>
          <button class="btn btn-secondary btn-sm tag-filter" data-tag="important" onclick="filterByTag('important')">important</button>
          <button class="btn btn-secondary btn-sm tag-filter" data-tag="regular" onclick="filterByTag('regular')">regular</button>
        </div>
        <button class="btn btn-secondary" onclick="refreshList()">刷新</button>
      </div>

      <div id="customerList">
        <div class="loading">加载中...</div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="customerModal">
    <div class="modal" style="max-width: 600px;">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">添加客户</div>
        <span class="modal-close" onclick="closeModal()">×</span>
      </div>
      <div class="modal-body">
        <form id="customerForm" onsubmit="submitCustomer(event)">
          <div class="form-row">
            <div class="form-group">
              <label>客户姓名 *</label>
              <input type="text" id="name" required placeholder="请输入客户姓名">
            </div>
            <div class="form-group">
              <label>公司名称</label>
              <input type="text" id="company" placeholder="请输入公司名称">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>联系电话 *</label>
              <input type="tel" id="phone" required placeholder="请输入联系电话">
            </div>
            <div class="form-group">
              <label>电子邮箱</label>
              <input type="email" id="email" placeholder="请输入电子邮箱">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>微信号</label>
              <input type="text" id="wechat" placeholder="请输入微信号">
            </div>
            <div class="form-group">
              <label>客户类型</label>
              <select id="type">
                <option value="general">普通客户</option>
                <option value="enterprise">企业客户</option>
                <option value="agent">代理客户</option>
                <option value="VIP">VIP客户</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>客户标签</label>
            <input type="text" id="tags" placeholder="用逗号分隔，如：new,potential">
            <div class="form-hint">可用标签：new（新客户）、potential（潜在客户）、important（重要客户）、regular（常客）</div>
          </div>

          <div class="form-group">
            <label>联系地址</label>
            <textarea id="address" placeholder="请输入联系地址"></textarea>
          </div>

          <div class="form-group">
            <label>备注说明</label>
            <textarea id="remarks" placeholder="其他说明信息"></textarea>
          </div>

          <div id="formAlert"></div>
          
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
            <button type="submit" class="btn btn-success">保存客户</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="detailModal">
    <div class="modal" style="max-width: 800px;">
      <div class="modal-header">
        <div class="modal-title">客户详情</div>
        <span class="modal-close" onclick="closeDetailModal()">×</span>
      </div>
      <div class="modal-body" id="detailContent">
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="groupModal">
    <div class="modal" style="max-width: 500px;">
      <div class="modal-header">
        <div class="modal-title">📁 客户分组管理</div>
        <span class="modal-close" onclick="closeGroupModal()">×</span>
      </div>
      <div class="modal-body">
        <div id="groupAlert"></div>
        <div style="margin-bottom: 16px;">
          <button class="btn btn-primary" onclick="showBatchAssignModal()">批量分配分组</button>
        </div>
        <div style="border-top: 1px solid var(--border-color); padding-top: 16px;">
          <div style="font-weight: 600; margin-bottom: 12px;">分组统计</div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div style="background: #f8f9fa; padding: 12px; border-radius: 8px;">
              <div style="font-size: 24px; font-weight: 600; color: var(--primary-color);">0</div>
              <div style="font-size: 13px; color: var(--text-secondary);">A组客户</div>
            </div>
            <div style="background: #f8f9fa; padding: 12px; border-radius: 8px;">
              <div style="font-size: 24px; font-weight: 600; color: var(--success-color);">0</div>
              <div style="font-size: 13px; color: var(--text-secondary);">B组客户</div>
            </div>
            <div style="background: #f8f9fa; padding: 12px; border-radius: 8px;">
              <div style="font-size: 24px; font-weight: 600; color: var(--warning-color);">0</div>
              <div style="font-size: 13px; color: var(--text-secondary);">C组客户</div>
            </div>
            <div style="background: #f8f9fa; padding: 12px; border-radius: 8px;">
              <div style="font-size: 24px; font-weight: 600; color: var(--text-muted);">0</div>
              <div style="font-size: 13px; color: var(--text-secondary);">未分组</div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeGroupModal()">关闭</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="batchAssignModal">
    <div class="modal" style="max-width: 500px;">
      <div class="modal-header">
        <div class="modal-title">批量分配分组</div>
        <span class="modal-close" onclick="closeBatchAssignModal()">×</span>
      </div>
      <div class="modal-body">
        <div id="batchAssignAlert"></div>
        <div class="form-group">
          <label>选择分组 *</label>
          <select id="assignGroup" required>
            <option value="">请选择分组</option>
            <option value="group_a">A组</option>
            <option value="group_b">B组</option>
            <option value="group_c">C组</option>
            <option value="">取消分组</option>
          </select>
        </div>
        <div class="form-group">
          <label>选择客户</label>
          <div style="max-height: 200px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 8px; padding: 8px;">
            <div id="customerCheckboxes"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeBatchAssignModal()">取消</button>
        <button class="btn btn-primary" onclick="submitBatchAssign()">确认分配</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/api';
    const API_URL = '/api/customers';
    let editingId = null;
    let customerDataCache = [];

    async function checkAuth() {
      try {
        const response = await fetch(`${API_BASE}/auth/me`, { credentials: 'include' });
        const result = await response.json();
        
        if (!result.success) {
          window.location.href = 'admin-login.html';
          return false;
        }
        
        document.getElementById('userName').textContent = result.data.username;
        return true;
      } catch (error) {
        window.location.href = 'admin-login.html';
        return false;
      }
    }
    
    async function logout() {
      try {
        await fetch(`${API_BASE}/auth/logout`, { method: 'POST', credentials: 'include' });
      } catch (error) {}
      window.location.href = 'admin-login.html';
    }

    async function loadCustomers() {
      try {
        const type = document.getElementById('typeFilter').value;
        const keyword = document.getElementById('searchKeyword').value.trim();
        
        const url = new URL(API_URL);
        if (type) url.searchParams.set('type', type);
        if (keyword) url.searchParams.set('keyword', keyword);
        
        const response = await fetch(url, { credentials: 'include' });
        const result = await response.json();
        
        if (result.success && result.data.length > 0) {
          customerDataCache = result.data;
          renderCustomerList(result.data);
          updateStats(result.data);
        } else {
          customerDataCache = [];
          document.getElementById('customerList').innerHTML = `
            <div class="empty-state">
              <div class="icon">📭</div>
              <div>暂无客户数据</div>
            </div>
          `;
          updateStats([]);
        }
      } catch (error) {
        document.getElementById('customerList').innerHTML = `<div class="empty-state"><div class="icon">❌</div><div>加载失败，请稍后重试</div></div>`;
      }
    }

    function exportCustomers() {
      if (customerDataCache.length === 0) {
        alert('没有可导出的客户数据');
        return;
      }

      const headers = ['客户名称', '公司', '电话', '邮箱', '微信', '类型', '标签', '地址', '创建日期'];
      const csvContent = [
        headers.join(','),
        ...customerDataCache.map(customer => [
          `"${(customer.name || '').replace(/"/g, '""')}"`,
          `"${(customer.company || '').replace(/"/g, '""')}"`,
          customer.phone || '',
          customer.email || '',
          customer.wechat || '',
          getTypeLabel(customer.type),
          customer.tags || '',
          `"${(customer.address || '').replace(/"/g, '""')}"`,
          formatDate(customer.created_at)
        ].join(','))
      ].join('\n');

      const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `客户导出_${new Date().toISOString().split('T')[0]}.csv`;
      link.click();
    }

    function renderCustomerList(customers) {
      const html = `
        <table class="table">
          <thead>
            <tr>
              <th>客户名称</th>
              <th>公司</th>
              <th>联系方式</th>
              <th>类型</th>
              <th>标签</th>
              <th>累计交易</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            ${customers.map(customer => `
              <tr>
                <td><strong style="color: var(--primary-color);">${customer.name}</strong></td>
                <td>${customer.company || '-'}</td>
                <td>${customer.phone || '-'}${customer.email ? '<br/>' + customer.email : ''}</td>
                <td><span class="badge badge-${customer.type}">${getTypeLabel(customer.type)}</span></td>
                <td>
                  ${customer.tags ? customer.tags.split(',').map(tag => `<span class="tag tag-${tag.trim()}">${tag.trim()}</span>`).join('') : '-'}
                </td>
                <td>¥${(customer.total_value || 0).toLocaleString()}</td>
                <td>
                  <button class="btn btn-secondary btn-sm" onclick="viewCustomer(${customer.id})">详情</button>
                  <button class="btn btn-primary btn-sm" onclick="editCustomer(${customer.id})">编辑</button>
                  <button class="btn btn-danger btn-sm" onclick="deleteCustomer(${customer.id})">删除</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      document.getElementById('customerList').innerHTML = html;
    }

    function getTypeLabel(type) {
      const labels = {
        general: '普通客户',
        enterprise: '企业客户',
        agent: '代理客户',
        VIP: 'VIP客户'
      };
      return labels[type] || type;
    }

    function updateStats(customers) {
      const total = customers.length;
      const active = customers.filter(c => c.status === 'active').length;
      const totalValue = customers.reduce((sum, c) => sum + (c.total_value || 0), 0);
      const avgContact = total > 0 ? Math.round(customers.reduce((sum, c) => sum + (c.contact_count || 0), 0) / total) : 0;
      
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statActive').textContent = active;
      document.getElementById('statTotalValue').textContent = totalValue.toLocaleString();
      document.getElementById('statAvgContact').textContent = avgContact;
    }

    function showAddModal() {
      editingId = null;
      document.getElementById('modalTitle').textContent = '添加客户';
      document.getElementById('customerForm').reset();
      document.getElementById('formAlert').innerHTML = '';
      document.getElementById('customerModal').classList.add('show');
    }

    async function editCustomer(id) {
      try {
        const response = await fetch(`${API_URL}/${id}`, { credentials: 'include' });
        const result = await response.json();
        
        if (result.success) {
          const customer = result.data;
          editingId = id;
          document.getElementById('modalTitle').textContent = '编辑客户';
          document.getElementById('name').value = customer.name || '';
          document.getElementById('company').value = customer.company || '';
          document.getElementById('phone').value = customer.phone || '';
          document.getElementById('email').value = customer.email || '';
          document.getElementById('wechat').value = customer.wechat || '';
          document.getElementById('type').value = customer.type || 'general';
          document.getElementById('tags').value = customer.tags || '';
          document.getElementById('address').value = customer.address || '';
          document.getElementById('remarks').value = customer.remarks || '';
          document.getElementById('formAlert').innerHTML = '';
          document.getElementById('customerModal').classList.add('show');
        }
      } catch (error) {
        alert('加载客户信息失败');
      }
    }

    async function viewCustomer(id) {
      try {
        const response = await fetch(`${API_URL}/${id}`, { credentials: 'include' });
        const result = await response.json();
        
        if (result.success) {
          const customer = result.data;
          renderCustomerDetail(customer);
          document.getElementById('detailModal').classList.add('show');
        } else {
          alert(result.message || '加载客户详情失败');
        }
      } catch (error) {
        alert('加载客户详情失败');
      }
    }

    function renderCustomerDetail(customer) {
      const detailHtml = `
        <div style="margin-bottom: 24px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="color: var(--primary-color); font-size: 20px;">${customer.name}</h3>
            <span class="badge badge-${customer.type}">${getTypeLabel(customer.type)}</span>
          </div>
          ${customer.company ? `<div style="color: var(--text-secondary); margin-top: 4px;">${customer.company}</div>` : ''}
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;">
          <div style="background: #f8f9fa; padding: 16px; border-radius: 8px;">
            <div style="font-weight: 600; margin-bottom: 12px;">📞 联系方式</div>
            <div style="margin-bottom: 8px;">电话：${customer.phone || '-'}</div>
            <div style="margin-bottom: 8px;">邮箱：${customer.email || '-'}</div>
            <div>微信：${customer.wechat || '-'}</div>
          </div>
          <div style="background: #f8f9fa; padding: 16px; border-radius: 8px;">
            <div style="font-weight: 600; margin-bottom: 12px;">🏠 基本信息</div>
            <div style="margin-bottom: 8px;">地址：${customer.address || '-'}</div>
            <div style="margin-bottom: 8px;">状态：${customer.status === 'active' ? '活跃' : '停用'}</div>
            <div>创建时间：${formatDate(customer.created_at)}</div>
          </div>
        </div>

        <div style="margin-bottom: 24px;">
          <div style="font-weight: 600; margin-bottom: 12px;">🏷️ 客户标签</div>
          <div>
            ${customer.tags ? customer.tags.split(',').map(tag => `<span class="tag tag-${tag.trim()}">${tag.trim()}</span>`).join('') : '<span style="color: var(--text-muted);">暂无标签</span>'}
          </div>
        </div>

        <div style="margin-bottom: 24px;">
          <div style="font-weight: 600; margin-bottom: 12px;">💰 消费数据</div>
          <div style="background: #f8f9fa; padding: 16px; border-radius: 8px;">
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; text-align: center;">
              <div>
                <div style="font-size: 24px; font-weight: 600; color: var(--primary-color);">¥${(customer.total_value || 0).toLocaleString()}</div>
                <div style="color: var(--text-secondary); font-size: 13px;">累计交易额</div>
              </div>
              <div>
                <div style="font-size: 24px; font-weight: 600; color: var(--success-color);">${customer.contact_count || 0} 次</div>
                <div style="color: var(--text-secondary); font-size: 13px;">联系次数</div>
              </div>
              <div>
                <div style="font-size: 24px; font-weight: 600; color: var(--warning-color);">${customer.last_contact ? formatDate(customer.last_contact) : '-'}</div>
                <div style="color: var(--text-secondary); font-size: 13px;">最后联系</div>
              </div>
            </div>
          </div>
        </div>

        <div style="margin-bottom: 24px;">
          <div style="font-weight: 600; margin-bottom: 12px;">📋 消费历史</div>
          <div style="max-height: 200px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 12px;">
            <div style="font-size: 13px; color: var(--text-secondary); text-align: center; padding: 20px;">
              📦 暂无消费记录，将在客户有订单后自动显示
            </div>
          </div>
        </div>

        ${customer.remarks ? `<div style="background: #fff3cd; padding: 12px; border-radius: 8px;">
          <div style="font-weight: 600; color: #856404; margin-bottom: 4px;">备注</div>
          <div>${customer.remarks}</div>
        </div>` : ''}
      `;
      document.getElementById('detailContent').innerHTML = detailHtml;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      const date = new Date(dateStr);
      return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.remove('show');
    }

    function closeModal() {
      document.getElementById('customerModal').classList.remove('show');
    }

    async function submitCustomer(event) {
      event.preventDefault();
      
      const formData = {
        name: document.getElementById('name').value.trim(),
        company: document.getElementById('company').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        email: document.getElementById('email').value.trim(),
        wechat: document.getElementById('wechat').value.trim(),
        type: document.getElementById('type').value,
        tags: document.getElementById('tags').value.trim(),
        address: document.getElementById('address').value.trim(),
        remarks: document.getElementById('remarks').value.trim()
      };

      if (!formData.name || !formData.phone) {
        showAlert('请填写客户姓名和联系电话', 'error');
        return;
      }

      try {
        const url = editingId ? `${API_URL}/${editingId}` : API_URL;
        const method = editingId ? 'PUT' : 'POST';
        
        const response = await fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData),
          credentials: 'include'
        });
        
        const result = await response.json();
        
        if (result.success) {
          showAlert(editingId ? '客户信息更新成功' : '客户添加成功', 'success');
          setTimeout(() => {
            closeModal();
            loadCustomers();
          }, 1500);
        } else {
          showAlert(result.message || '操作失败', 'error');
        }
      } catch (error) {
        showAlert('网络错误，请稍后重试', 'error');
      }
    }

    function showAlert(message, type) {
      const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
      document.getElementById('formAlert').innerHTML = `<div class="alert ${alertClass}">${message}</div>`;
    }

    async function deleteCustomer(id) {
      if (!confirm('确定要删除这位客户吗？')) return;
      
      try {
        const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE', credentials: 'include' });
        const result = await response.json();
        
        if (result.success) {
          alert('删除成功');
          loadCustomers();
        } else {
          alert('删除失败');
        }
      } catch (error) {
        alert('删除失败');
      }
    }

    function handleSearch() {
      loadCustomers();
    }

    function handleFilter() {
      loadCustomers();
    }

    function refreshList() {
      document.getElementById('searchKeyword').value = '';
      document.getElementById('typeFilter').value = '';
      document.getElementById('groupFilter').value = '';
      document.querySelectorAll('.tag-filter').forEach(btn => btn.classList.remove('active'));
      currentTagFilter = '';
      loadCustomers();
    }

    let currentTagFilter = '';

    function filterByTag(tag) {
      const buttons = document.querySelectorAll('.tag-filter');
      buttons.forEach(btn => btn.classList.remove('active'));
      
      if (currentTagFilter === tag) {
        currentTagFilter = '';
      } else {
        currentTagFilter = tag;
        document.querySelector(`.tag-filter[data-tag="${tag}"]`).classList.add('active');
      }
      
      loadCustomers();
    }

    async function loadCustomers() {
      try {
        const type = document.getElementById('typeFilter').value;
        const group = document.getElementById('groupFilter').value;
        const keyword = document.getElementById('searchKeyword').value.trim();
        
        const url = new URL(API_URL);
        if (type) url.searchParams.set('type', type);
        if (group) url.searchParams.set('group', group);
        if (keyword) url.searchParams.set('keyword', keyword);
        if (currentTagFilter) url.searchParams.set('tag', currentTagFilter);
        
        const response = await fetch(url, { credentials: 'include' });
        const result = await response.json();
        
        if (result.success && result.data.length > 0) {
          customerDataCache = result.data;
          renderCustomerList(result.data);
          updateStats(result.data);
        } else {
          customerDataCache = [];
          document.getElementById('customerList').innerHTML = `
            <div class="empty-state">
              <div class="icon">📭</div>
              <div>暂无客户数据</div>
            </div>
          `;
          updateStats([]);
        }
      } catch (error) {
        document.getElementById('customerList').innerHTML = `<div class="empty-state"><div class="icon">❌</div><div>加载失败，请稍后重试</div></div>`;
      }
    }

    function showGroupModal() {
      document.getElementById('groupAlert').innerHTML = '';
      document.getElementById('groupModal').classList.add('show');
    }

    function closeGroupModal() {
      document.getElementById('groupModal').classList.remove('show');
    }

    function showBatchAssignModal() {
      document.getElementById('batchAssignAlert').innerHTML = '';
      document.getElementById('assignGroup').value = '';
      
      if (customerDataCache.length === 0) {
        document.getElementById('customerCheckboxes').innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 16px;">暂无客户可选择</div>';
      } else {
        document.getElementById('customerCheckboxes').innerHTML = customerDataCache.map(customer => `
          <label style="display: flex; align-items: center; gap: 8px; padding: 6px; cursor: pointer;">
            <input type="checkbox" class="assign-checkbox" data-id="${customer.id}">
            <span style="font-size: 13px;">${customer.name} ${customer.company ? `(${customer.company})` : ''}</span>
          </label>
        `).join('');
      }
      
      document.getElementById('batchAssignModal').classList.add('show');
    }

    function closeBatchAssignModal() {
      document.getElementById('batchAssignModal').classList.remove('show');
    }

    async function submitBatchAssign() {
      const group = document.getElementById('assignGroup').value;
      const selectedCheckboxes = document.querySelectorAll('.assign-checkbox:checked');
      
      if (selectedCheckboxes.length === 0) {
        document.getElementById('batchAssignAlert').innerHTML = '<div class="alert alert-error">请选择要分配的客户</div>';
        return;
      }
      
      const customerIds = Array.from(selectedCheckboxes).map(cb => parseInt(cb.dataset.id));
      
      try {
        const promises = customerIds.map(id => 
          fetch(`${API_URL}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ group }),
            credentials: 'include'
          })
        );
        
        await Promise.all(promises);
        document.getElementById('batchAssignAlert').innerHTML = '<div class="alert alert-success">分组分配成功</div>';
        
        setTimeout(() => {
          closeBatchAssignModal();
          closeGroupModal();
          loadCustomers();
        }, 1500);
      } catch (error) {
        document.getElementById('batchAssignAlert').innerHTML = '<div class="alert alert-error">分配失败</div>';
      }
    }

    document.addEventListener('DOMContentLoaded', async function() {
      const isAuthenticated = await checkAuth();
      if (isAuthenticated) {
        loadCustomers();
      }
    });
  </script>
</body>
</html>
