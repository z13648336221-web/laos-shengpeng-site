<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录日志 - 重庆恒慈国际贸易有限公司</title>
  <link rel="stylesheet" href="css/admin.css">
  <style>
    .log-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    .log-table th, .log-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
    .log-table th { background: #f8f9fa; font-weight: 600; color: #555; font-size: 13px; text-transform: uppercase; }
    .log-table td { font-size: 14px; color: #333; }
    .log-table tr:hover { background: #f5f7fa; }
    .action-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
    .action-login { background: #e8f5e9; color: #2e7d32; }
    .action-logout { background: #fff3e0; color: #e65100; }
    .action-other { background: #e3f2fd; color: #1565c0; }
    .ip-address { font-family: 'Courier New', monospace; background: #f5f5f5; padding: 2px 8px; border-radius: 4px; font-size: 13px; }
    .filter-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .filter-bar input, .filter-bar select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    .pagination { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 20px; }
    .pagination button { padding: 6px 14px; border: 1px solid #ddd; background: #fff; border-radius: 6px; cursor: pointer; }
    .pagination button:hover { background: #f0f0f0; }
    .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
    .pagination .page-info { font-size: 14px; color: #666; }
    .stats-bar { display: flex; gap: 20px; margin-bottom: 15px; }
    .stat-item { background: #f8f9fa; padding: 10px 20px; border-radius: 8px; }
    .stat-item .stat-value { font-size: 20px; font-weight: 700; color: #333; }
    .stat-item .stat-label { font-size: 12px; color: #888; margin-top: 2px; }
    .empty-state { text-align: center; padding: 60px 20px; color: #999; }
    .empty-state .icon { font-size: 48px; margin-bottom: 15px; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="logo">🚢 恒慈国际贸易管理</div>
    <nav>
      <a href="admin-dashboard.html">📊 仪表盘</a>
      <a href="admin.html">📰 新闻管理</a>
      <a href="admin-orders.html">📦 订单管理</a>
      <a href="admin-customers.html">👥 客户管理</a>
      <a href="admin-quotes.html">💰 报价管理</a>
      <a href="admin-inquiry.html">📋 询价管理</a>
      <a href="admin-chat.html">💬 客服管理</a>
      <a href="admin-reports.html">📈 数据分析</a>
      <a href="admin-logs.html" class="active">🔒 登录日志</a>
    </nav>
  </div>

  <div class="main-content">
    <div class="header">
      <h1>🔒 登录日志</h1>
      <div class="user-info">
        <span class="user-name" id="userName">管理员</span>
        <button class="btn btn-secondary btn-sm" onclick="logout()">退出登录</button>
      </div>
    </div>

    <!-- 统计概览 -->
    <div class="card">
      <div class="stats-bar" id="statsBar">
        <div class="stat-item">
          <div class="stat-value" id="totalLogs">-</div>
          <div class="stat-label">总记录数</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="todayLogs">-</div>
          <div class="stat-label">今日登录</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="uniqueIPs">-</div>
          <div class="stat-label">独立IP数</div>
        </div>
      </div>
    </div>

    <!-- 筛选栏 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">🔍 筛选条件</div>
      </div>
      <div class="filter-bar">
        <input type="text" id="searchIP" placeholder="搜索IP地址..." onkeyup="if(event.key==='Enter')loadLogs()">
        <select id="filterAction" onchange="loadLogs()">
          <option value="">全部操作</option>
          <option value="login">登录</option>
          <option value="logout">登出</option>
        </select>
        <input type="date" id="startDate" onchange="loadLogs()">
        <span>至</span>
        <input type="date" id="endDate" onchange="loadLogs()">
        <button class="btn btn-primary" onclick="loadLogs()">🔍 查询</button>
        <button class="btn btn-secondary" onclick="resetFilters()">重置</button>
      </div>
    </div>

    <!-- 日志列表 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">📋 登录记录</div>
        <button class="btn btn-secondary btn-sm" onclick="loadLogs()">🔄 刷新</button>
      </div>
      <div id="logsContainer">
        <table class="log-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>管理员</th>
              <th>操作</th>
              <th>IP地址</th>
              <th>描述</th>
              <th>时间</th>
            </tr>
          </thead>
          <tbody id="logsBody">
            <tr><td colspan="6" class="empty-state"><div class="icon">📭</div>加载中...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <script>
    let currentPage = 1;
    const pageSize = 20;
    let allLogs = [];

    // 检查登录状态
    async function checkAuth() {
      try {
        const res = await fetch('/api/auth/me');
        const data = await res.json();
        if (!data.success) {
          window.location.href = 'admin-login.html';
          return;
        }
        document.getElementById('userName').textContent = data.data.username;
      } catch (e) {
        window.location.href = 'admin-login.html';
      }
    }

    // 加载日志
    async function loadLogs() {
      const searchIP = document.getElementById('searchIP').value.trim();
      const action = document.getElementById('filterAction').value;
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;

      let url = '/api/logs?page=1&limit=1000';
      if (action) url += '&action=' + encodeURIComponent(action);
      if (startDate) url += '&startDate=' + startDate;
      if (endDate) url += '&endDate=' + endDate + 'T23:59:59';

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (!data.success) {
          alert('加载日志失败');
          return;
        }

        allLogs = data.data || [];

        // 客户端IP筛选
        if (searchIP) {
          allLogs = allLogs.filter(log => log.ip && log.ip.includes(searchIP));
        }

        updateStats();
        renderLogs();
      } catch (e) {
        console.error('加载日志失败:', e);
        document.getElementById('logsBody').innerHTML = '<tr><td colspan="6" class="empty-state"><div class="icon">⚠️</div>加载失败，请刷新重试</td></tr>';
      }
    }

    // 更新统计
    function updateStats() {
      document.getElementById('totalLogs').textContent = allLogs.length;

      const today = new Date().toISOString().split('T')[0];
      const todayCount = allLogs.filter(log => log.created_at && log.created_at.startsWith(today)).length;
      document.getElementById('todayLogs').textContent = todayCount;

      const ips = new Set(allLogs.map(log => log.ip).filter(Boolean));
      document.getElementById('uniqueIPs').textContent = ips.size;
    }

    // 渲染日志列表
    function renderLogs() {
      const tbody = document.getElementById('logsBody');
      const start = (currentPage - 1) * pageSize;
      const pageData = allLogs.slice(start, start + pageSize);

      if (pageData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-state"><div class="icon">📭</div>暂无登录记录</td></tr>';
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      tbody.innerHTML = pageData.map(log => {
        const actionClass = log.action === 'login' ? 'action-login' : log.action === 'logout' ? 'action-logout' : 'action-other';
        const actionText = log.action === 'login' ? '登录' : log.action === 'logout' ? '登出' : log.action;
        const time = log.created_at ? new Date(log.created_at).toLocaleString('zh-CN') : '-';
        return `<tr>
          <td>${log.id || '-'}</td>
          <td>${log.admin_name || '-'}</td>
          <td><span class="action-badge ${actionClass}">${actionText}</span></td>
          <td><span class="ip-address">${log.ip || '-'}</span></td>
          <td>${log.description || '-'}</td>
          <td>${time}</td>
        </tr>`;
      }).join('');

      renderPagination();
    }

    // 分页
    function renderPagination() {
      const totalPages = Math.ceil(allLogs.length / pageSize);
      if (totalPages <= 1) {
        document.getElementById('pagination').innerHTML = '';
        return;
      }
      document.getElementById('pagination').innerHTML = `
        <button onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>上一页</button>
        <span class="page-info">第 ${currentPage} / ${totalPages} 页，共 ${allLogs.length} 条</span>
        <button onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>下一页</button>
      `;
    }

    function goPage(page) {
      const totalPages = Math.ceil(allLogs.length / pageSize);
      if (page < 1 || page > totalPages) return;
      currentPage = page;
      renderLogs();
    }

    // 重置筛选
    function resetFilters() {
      document.getElementById('searchIP').value = '';
      document.getElementById('filterAction').value = '';
      document.getElementById('startDate').value = '';
      document.getElementById('endDate').value = '';
      currentPage = 1;
      loadLogs();
    }

    // 退出登录
    async function logout() {
      try {
        await fetch('/api/auth/logout', { method: 'POST' });
      } catch (e) {}
      window.location.href = 'admin-login.html';
    }

    // 初始化
    checkAuth();
    loadLogs();
  </script>
</body>
</html>
