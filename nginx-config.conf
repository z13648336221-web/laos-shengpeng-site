server {
    listen 80;
    server_name 43.129.173.218;
    return 301 https://hengciglobal.com$request_uri;
}

server {
    listen 80;
    server_name hengciglobal.com www.hengciglobal.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hengciglobal.com www.hengciglobal.com;

    ssl_certificate /etc/letsencrypt/live/hengciglobal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hengciglobal.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
    gzip_comp_level 6;

    # 隐藏Nginx版本号
    server_tokens off;

    # 请求体大小限制 (10MB)
    client_max_body_size 10m;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        root /var/www/laos-logistics;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        root /var/www/laos-logistics;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        # 安全头也需要在location块中设置
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # API代理
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # API不缓存
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 上传文件目录
    location /uploads/ {
        alias /var/www/laos-logistics/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        # 禁止在uploads目录执行脚本
        location ~* \.(php|jsp|asp|sh|cgi)$ {
            deny all;
        }
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
