<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>客服管理 - 重庆恒慈国际贸易有限公司</title>
  <link rel="stylesheet" href="public/css/admin.css" />
  <style>
    .chat-container {
      display: flex;
      height: calc(100vh - 180px);
      gap: 20px;
    }
    
    .chat-sidebar {
      width: 340px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    .chat-sidebar-header {
      padding: 20px;
      border-bottom: 1px solid #eee;
      background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
      color: white;
    }
    
    .chat-sidebar-header h3 {
      margin: 0;
      font-size: 18px;
    }
    
    .chat-sidebar-header p {
      margin: 4px 0 0;
      font-size: 13px;
      opacity: 0.9;
    }
    
    .chat-sessions {
      flex: 1;
      overflow-y: auto;
    }
    
    .chat-session-item {
      padding: 16px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .chat-session-item:hover {
      background: #f8f9fa;
    }
    
    .chat-session-item.active {
      background: #e8f0fe;
      border-left: 4px solid #2a5298;
    }
    
    .chat-session-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    
    .chat-session-name {
      font-weight: 600;
      color: #333;
    }
    
    .chat-session-badge {
      background: #ff4757;
      color: white;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 10px;
      min-width: 20px;
      text-align: center;
    }
    
    .chat-session-preview {
      font-size: 13px;
      color: #666;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .chat-session-time {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }
    
    .chat-main {
      flex: 1;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .chat-main-header {
      padding: 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .chat-main-header-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .chat-main-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
    }
    
    .chat-main-title {
      font-weight: 600;
      font-size: 16px;
      color: #333;
    }
    
    .chat-main-meta {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }
    
    .chat-actions {
      display: flex;
      gap: 8px;
    }
    
    .chat-messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f0f2f5;
    }
    
    .chat-empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #999;
    }
    
    .chat-empty-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }
    
    .message-row {
      display: flex;
      margin-bottom: 20px;
    }
    
    .message-row.admin {
      justify-content: flex-end;
    }
    
    .message-row.visitor {
      justify-content: flex-start;
    }
    
    .message-bubble {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      word-wrap: break-word;
    }
    
    .message-row.admin .message-bubble {
      background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
      color: white;
      border-bottom-right-radius: 4px;
    }
    
    .message-row.visitor .message-bubble {
      background: white;
      color: #333;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }
    
    .message-time {
      font-size: 11px;
      color: #999;
      margin-top: 6px;
    }
    
    .message-row.admin .message-time {
      text-align: right;
    }
    
    .message-row.visitor .message-time {
      text-align: left;
    }
    
    .chat-input-container {
      padding: 20px;
      border-top: 1px solid #eee;
      background: white;
    }
    
    .chat-input-row {
      display: flex;
      gap: 12px;
    }
    
    .chat-input-row textarea {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      resize: none;
      height: 60px;
      outline: none;
      transition: border-color 0.2s;
    }
    
    .chat-input-row textarea:focus {
      border-color: #2a5298;
    }
    
    .quick-reply-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    
    .quick-reply-btn {
      padding: 6px 14px;
      background: #f0f2f5;
      border: 1px solid #ddd;
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .quick-reply-btn:hover {
      background: #e8f0fe;
      border-color: #2a5298;
      color: #2a5298;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="logo">🚢 恒慈国际贸易管理</div>
    <nav>
      <a href="admin-dashboard.html">📊 仪表盘</a>
      <a href="admin.html">📰 新闻管理</a>
      <a href="admin-orders.html">📦 订单管理</a>
      <a href="admin-customers.html">👥 客户管理</a>
      <a href="admin-quotes.html">💰 报价管理</a>
      <a href="admin-inquiry.html">📋 询价管理</a>
      <a href="admin-chat.html" class="active">💬 客服管理</a>
      <a href="admin-reports.html">📈 数据分析</a>
      <a href="admin-logs.html">🔒 登录日志</a>
    </nav>
  </div>

  <div class="main-content">
    <div class="header">
      <h1>💬 客服管理</h1>
      <div class="user-info">
        <span class="user-name" id="userName">管理员</span>
        <button class="btn btn-secondary btn-sm" onclick="logout()">退出登录</button>
      </div>
    </div>

    <div class="chat-container">
      <div class="chat-sidebar">
        <div class="chat-sidebar-header">
          <h3>会话列表</h3>
          <p>与客户的在线沟通</p>
        </div>
        <div class="chat-sessions" id="chatSessions">
          <div class="chat-empty-state" id="sessionsEmpty">
            <div class="chat-empty-icon">📭</div>
            <div>暂无会话</div>
          </div>
        </div>
      </div>
      
      <div class="chat-main">
        <div class="chat-main-header">
          <div class="chat-main-header-info" id="chatMainHeaderInfo">
            <div class="chat-main-avatar">👤</div>
            <div>
              <div class="chat-main-title">请选择一个会话</div>
              <div class="chat-main-meta">-</div>
            </div>
          </div>
          <div class="chat-actions" id="chatActions" style="display: none;">
            <button class="btn btn-secondary btn-sm" onclick="deleteCurrentSession()">删除会话</button>
          </div>
        </div>
        
        <div class="chat-messages-container" id="chatMessagesContainer">
          <div class="chat-empty-state">
            <div class="chat-empty-icon">💬</div>
            <div>选择左侧会话开始聊天</div>
          </div>
        </div>
        
        <div class="chat-input-container" id="chatInputContainer" style="display: none;">
          <div class="quick-reply-btns">
            <span class="quick-reply-btn" data-text="您好，请问有什么可以帮助您的？">您好，请问有什么可以帮助您的？</span>
            <span class="quick-reply-btn" data-text="好的，我会尽快为您处理。">好的，我会尽快为您处理。</span>
            <span class="quick-reply-btn" data-text="感谢您的咨询！">感谢您的咨询！</span>
          </div>
          <div class="chat-input-row">
            <textarea id="replyInput" placeholder="输入回复内容..."></textarea>
            <button class="btn btn-primary" onclick="sendReply()" style="align-self: flex-end;">发送</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/api';
    let currentVisitorId = null;
    let sessions = [];
    let pollInterval = null;

    async function checkAuth() {
      try {
        const response = await fetch(`${API_BASE}/auth/me`, { credentials: 'include' });
        const result = await response.json();
        if (!result.success) {
          window.location.href = 'admin-login.html';
          return false;
        }
        document.getElementById('userName').textContent = result.data.username;
        return true;
      } catch (err) {
        window.location.href = 'admin-login.html';
        return false;
      }
    }

    async function logout() {
      try {
        await fetch(`${API_BASE}/auth/logout`, { method: 'POST', credentials: 'include' });
      } catch (err) {}
      window.location.href = 'admin-login.html';
    }

    async function loadSessions() {
      try {
        console.log('正在加载会话...');
        const response = await fetch(`${API_BASE}/chat/sessions`, { credentials: 'include' });
        const result = await response.json();
        console.log('API返回:', result);
        
        if (result.success) {
          sessions = result.data;
          console.log('会话列表:', sessions);
          renderSessions();
        }
      } catch (err) {
        console.error('加载会话失败:', err);
      }
    }

    function renderSessions() {
      const container = document.getElementById('chatSessions');
      const emptyState = document.getElementById('sessionsEmpty');
      
      if (!container || !emptyState) {
        console.error('renderSessions: DOM元素未找到');
        return;
      }
      
      if (sessions.length === 0) {
        emptyState.style.display = 'flex';
        return;
      }
      
      emptyState.style.display = 'none';
      
      container.innerHTML = sessions.map(session => `
        <div class="chat-session-item ${currentVisitorId === session.visitorId ? 'active' : ''}" 
             onclick="selectSession('${session.visitorId}')">
          <div class="chat-session-top">
            <span class="chat-session-name">${escapeHtml(session.visitorName)}</span>
            ${session.unreadCount > 0 ? `<span class="chat-session-badge">${session.unreadCount}</span>` : ''}
          </div>
          <div class="chat-session-preview">${escapeHtml(session.lastMessage)}</div>
          <div class="chat-session-time">${formatTime(session.lastMessageTime)}</div>
        </div>
      `).join('');
    }

    async function selectSession(visitorId) {
      console.log('选择会话:', visitorId);
      currentVisitorId = visitorId;
      renderSessions();
      await loadMessages(visitorId);
      
      const chatInputContainer = document.getElementById('chatInputContainer');
      const chatActions = document.getElementById('chatActions');
      const chatMainHeaderInfo = document.getElementById('chatMainHeaderInfo');
      
      if (chatInputContainer) chatInputContainer.style.display = 'block';
      if (chatActions) chatActions.style.display = 'flex';
      
      const session = sessions.find(s => s.visitorId === visitorId);
      if (session && chatMainHeaderInfo) {
        chatMainHeaderInfo.innerHTML = `
          <div class="chat-main-avatar">👤</div>
          <div>
            <div class="chat-main-title">${escapeHtml(session.visitorName)}</div>
            <div class="chat-main-meta">${session.messageCount} 条消息</div>
          </div>
        `;
      }
    }

    async function loadMessages(visitorId) {
      try {
        const response = await fetch(`${API_BASE}/chat/session/${visitorId}`, { credentials: 'include' });
        const result = await response.json();
        
        if (result.success) {
          renderMessages(result.data);
        }
      } catch (err) {
        console.error('加载消息失败:', err);
      }
    }

    function renderMessages(messages) {
      const container = document.getElementById('chatMessagesContainer');
      
      if (messages.length === 0) {
        container.innerHTML = `
          <div class="chat-empty-state">
            <div class="chat-empty-icon">💬</div>
            <div>暂无消息</div>
          </div>
        `;
        return;
      }
      
      container.innerHTML = messages.map(msg => `
        <div class="message-row ${msg.sender}">
          <div>
            <div class="message-bubble">${escapeHtml(msg.message)}</div>
            <div class="message-time">${formatTime(msg.createdAt)}</div>
          </div>
        </div>
      `).join('');
      
      container.scrollTop = container.scrollHeight;
    }

    async function sendReply() {
      const input = document.getElementById('replyInput');
      const message = input.value.trim();
      
      if (!message || !currentVisitorId) return;
      
      try {
        const response = await fetch(`${API_BASE}/chat/admin/reply`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            visitorId: currentVisitorId,
            message
          })
        });
        
        const result = await response.json();
        if (result.success) {
          input.value = '';
          await loadMessages(currentVisitorId);
          await loadSessions();
        }
      } catch (err) {
        console.error('发送失败:', err);
        alert('发送失败，请稍后重试');
      }
    }

    async function deleteCurrentSession() {
      if (!currentVisitorId) return;
      if (!confirm('确定要删除这个会话吗？')) return;
      
      try {
        const response = await fetch(`${API_BASE}/chat/session/${currentVisitorId}`, {
          method: 'DELETE',
          credentials: 'include'
        });
        
        const result = await response.json();
        if (result.success) {
          currentVisitorId = null;
          await loadSessions();
          
          document.getElementById('chatInputContainer').style.display = 'none';
          document.getElementById('chatActions').style.display = 'none';
          document.getElementById('chatMainHeaderInfo').innerHTML = `
            <div class="chat-main-avatar">👤</div>
            <div>
              <div class="chat-main-title">请选择一个会话</div>
              <div class="chat-main-meta">-</div>
            </div>
          `;
          document.getElementById('chatMessagesContainer').innerHTML = `
            <div class="chat-empty-state">
              <div class="chat-empty-icon">💬</div>
              <div>选择左侧会话开始聊天</div>
            </div>
          `;
        }
      } catch (err) {
        console.error('删除失败:', err);
        alert('删除失败');
      }
    }

    function formatTime(timeStr) {
      const date = new Date(timeStr);
      const now = new Date();
      const diff = now - date;
      
      if (diff < 60000) return '刚刚';
      if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
      if (diff < 86400000) return date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');
      return (date.getMonth() + 1) + '/' + date.getDate() + ' ' + date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.querySelectorAll('.quick-reply-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('replyInput').value = btn.dataset.text;
      });
    });

    document.getElementById('replyInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendReply();
      }
    });

    document.addEventListener('DOMContentLoaded', async () => {
      const isAuth = await checkAuth();
      if (isAuth) {
        await loadSessions();
        
        pollInterval = setInterval(loadSessions, 5000);
      }
    });

    window.addEventListener('beforeunload', () => {
      if (pollInterval) clearInterval(pollInterval);
    });
  </script>
</body>
</html>
